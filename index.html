        const commands = rawData.trim().split(/\r?\n/).map((line, id) => {
            const [category, title, command, note = "", open = ""] = line.split("\t");
            return { id, category, title, command, note, open };
        });

        const categories = [...new Set(commands.map(item => item.category))];
        const categoryCounts = commands.reduce((counts, item) => {
            counts.set(item.category, (counts.get(item.category) || 0) + 1);
            return counts;
        }, new Map());
        let activeCategory = categories[0];

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[char]);
        }

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const contentGrid = document.getElementById('contentGrid');
        const categoryNav = document.getElementById('categoryNav');
        const emptyState = document.getElementById('emptyState');
        const themeToggle = document.getElementById('themeToggle');
        const toast = document.getElementById('toast');

        // Initialize Icons
        lucide.createIcons();

        // Render Navigation
        function renderNav() {
            categoryNav.innerHTML = categories.map(cat => `
                            <button type="button" class="nav-link w-full whitespace-nowrap lg:whitespace-normal text-left ${cat === activeCategory ? 'active' : ''}" data-category="${escapeHTML(cat)}" aria-pressed="${cat === activeCategory}">
                    <i data-lucide="tag" class="w-4 h-4"></i>
                    <span>${escapeHTML(cat)}（${categoryCounts.get(cat)}）</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        // Render Commands
        function renderCommands(filter = '') {
            const keyword = filter.trim().toLowerCase();
            const filtered = keyword
                ? commands.filter(item =>
                    item.title.toLowerCase().includes(keyword) ||
                    item.command.toLowerCase().includes(keyword) ||
                    item.category.toLowerCase().includes(keyword) ||
                    item.note.toLowerCase().includes(keyword)
                )
                : commands.filter(item => item.category === activeCategory);

            if (filtered.length === 0) {
                contentGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            const panelTitle = keyword ? `搜索结果：${filter.trim()}` : activeCategory;

            contentGrid.innerHTML = `
                <section class="glass-card h-[752px] rounded-2xl p-4 flex flex-col dark:bg-[#101114] dark:border-[#2a2d34] animate-fade-in">
                    <div class="flex items-center gap-3 mb-3 pb-3 border-b border-zinc-200 dark:border-[#2a2d34]">
                        <h3 class="text-lg font-bold truncate" title="${escapeHTML(panelTitle)}">${escapeHTML(panelTitle)}</h3>
                        <div class="h-px flex-1 bg-zinc-200 dark:bg-[#2a2d34]"></div>
                        <span class="flex-shrink-0 px-2 py-1 rounded-lg bg-zinc-100 dark:bg-[#181b21] border border-zinc-200 dark:border-[#30343d] text-xs font-mono text-zinc-500 dark:text-zinc-300">${filtered.length}</span>
                    </div>
                    <div class="h-[656px] flex-none overflow-y-auto pr-2 space-y-2" tabindex="0" aria-label="${escapeHTML(panelTitle)}命令列表，共${filtered.length}项">
                        ${filtered.map(item => `
                            <div class="h-[102px] flex-shrink-0 flex items-center gap-3 px-4 py-2 rounded-xl bg-zinc-50 dark:bg-[#181b21] border border-zinc-200/80 dark:border-[#2b2f38] hover:border-brand-500/50 transition-colors">
                                <div class="min-w-0 flex-1">
                                    <h4 class="font-bold text-sm text-zinc-800 dark:text-zinc-100 truncate" title="${escapeHTML(item.title)}">${escapeHTML(item.title)}</h4>
                                    <code class="font-mono text-sm text-brand-600 dark:text-[#38bdf8] block truncate" title="${escapeHTML(item.command)}">${escapeHTML(item.command)}</code>
                                    ${item.note ? `<p class="text-[11px] text-zinc-500 dark:text-zinc-400 truncate" title="${escapeHTML(item.note)}">${escapeHTML(item.note)}</p>` : ''}
                                </div>
                                <div class="flex flex-shrink-0 gap-1.5">
                                    <button type="button" data-copy-id="${item.id}" class="h-9 px-3 inline-flex items-center gap-1.5 rounded-lg bg-brand-500 hover:bg-brand-600 text-white dark:text-zinc-950 text-xs font-bold transition-colors active:scale-95" title="复制命令">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i><span>复制</span>
                                    </button>
                                    ${item.open ? `<button type="button" data-open-id="${item.id}" class="h-9 px-3 inline-flex items-center gap-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 text-brand-600 dark:text-[#38bdf8] text-xs font-bold hover:bg-zinc-100 dark:hover:bg-[#20232a] transition-colors" title="直接打开"><i data-lucide="external-link" class="w-3.5 h-3.5"></i><span>打开</span></button>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;

            lucide.createIcons();
        }

        // Copy Functionality
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
            }
            showToast();
        }

        function showToast() {
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 2000);
        }

        contentGrid.addEventListener('click', event => {
            const copyButton = event.target.closest('[data-copy-id]');
            const openButton = event.target.closest('[data-open-id]');
            if (copyButton) {
                const item = commands[Number(copyButton.dataset.copyId)];
                if (item) copyToClipboard(item.command);
            }
            if (openButton) {
                const item = commands[Number(openButton.dataset.openId)];
                if (item?.open) window.location.href = item.open;
            }
        });

        categoryNav.addEventListener('click', event => {
            const button = event.target.closest('[data-category]');
            if (!button) return;
            activeCategory = button.dataset.category;
            searchInput.value = '';
            renderNav();
            renderCommands();
        });

        // Search Input Handler
        searchInput.addEventListener('input', (e) => {
            renderCommands(e.target.value);
        });

        // Shortcut for search
        window.addEventListener('keydown', (e) => {
            if (e.key === '/') {
                if (document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
            }
        });

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            const root = document.documentElement;
            root.classList.add('theme-switching');
            root.classList.toggle('dark');
            try {
                localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
            } catch (error) {
                // 本地存储不可用时仍保留本次切换结果
            }
            requestAnimationFrame(() => root.classList.remove('theme-switching'));
        });

        // Initial Render
        renderNav();
        renderCommands();
    </script>
</body>
